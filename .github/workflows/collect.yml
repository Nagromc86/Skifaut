name: Collecte des données de stations

on:
  workflow_dispatch:
    inputs:
      only:
        description: 'Domaines (ids séparés par des virgules, vide = tous)'
        required: false
        default: ''
  schedule:
    - cron: '17 4 * * 1'

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Graphes pistes et remontées (OpenStreetMap)
        run: node collector/graphs.js ${{ github.event.inputs.only != '' && format('--only={0}', github.event.inputs.only) || '' }}
      - name: Commit des données
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add www/data/graphs
          if git diff --cached --quiet; then echo "Rien de nouveau"; else git commit -m "Données stations : graphes OSM mis à jour" && git pull --rebase -q && git push; fi
