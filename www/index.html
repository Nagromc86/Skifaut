<title>Skifaut</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@600;700&display=swap">
<style>
/* Layout: a single phone-width app column — sticky mountain header, scrolling view, fixed bottom nav.
   Palette: bluebird-day snow (light) / night-piste navy (dark); glacier teal brand, piste colours as data. */
:root{
  --bg:#eaf1f6; --surface:#ffffff; --surface2:#dfe9f1; --fg:#102335; --muted:#5b7389; --line:#ccdae6;
  --accent:#0a97ab; --accent-ink:#ffffff; --accent-soft:#d3eef1;
  --vert:#2e9e54; --bleu:#2f6fe0; --rouge:#df3b3b; --noir:#141b24; --warn:#c9771f; --closed:#9fb0bf;
  --warn-bg:#fbeeda; --crit:#c62a2a; --crit-bg:#fbe0e0; --bus:#7a5cc0;
  --sky1:#cfe6f2; --sky2:#eef6fb; --snow:#ffffff;
  --disp:"Barlow Semi Condensed",Impact,sans-serif; --body:"Barlow","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0b1520; --surface:#132131; --surface2:#1c2d40; --fg:#e9f1f8; --muted:#90a6ba; --line:#283b4f;
  --accent:#25c0d1; --accent-ink:#06222a; --accent-soft:#113640;
  --vert:#46c76a; --bleu:#5f95f3; --rouge:#ff5b5b; --noir:#aeb9c6; --warn:#eda24a; --closed:#55697b;
  --warn-bg:#3a2c16; --crit:#ff6b6b; --crit-bg:#3a1c1c; --bus:#a78bda;
  --sky1:#12283b; --sky2:#0d1b28; --snow:#22384d;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b1520; --surface:#132131; --surface2:#1c2d40; --fg:#e9f1f8; --muted:#90a6ba; --line:#283b4f;
  --accent:#25c0d1; --accent-ink:#06222a; --accent-soft:#113640;
  --vert:#46c76a; --bleu:#5f95f3; --rouge:#ff5b5b; --noir:#aeb9c6; --warn:#eda24a; --closed:#55697b;
  --warn-bg:#3a2c16; --crit:#ff6b6b; --crit-bg:#3a1c1c; --bus:#a78bda;
  --sky1:#12283b; --sky2:#0d1b28; --snow:#22384d;
  color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
.app{max-width:500px;margin:0 auto;min-height:100vh;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{font-family:var(--disp);font-weight:700;margin:0;letter-spacing:.2px;text-wrap:balance}
button{font-family:inherit;cursor:pointer}
/* top bar */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:12px 2px 10px;border-bottom:1px solid var(--line);margin-bottom:14px}
.wordmark{display:flex;align-items:center;gap:8px;font-family:var(--disp);font-weight:700;font-size:1.5rem;letter-spacing:.3px}
.wordmark .mk{width:26px;height:26px;flex:none}
.wordmark b{color:var(--accent)}
.dpill{display:flex;align-items:center;gap:6px;background:var(--accent-soft);color:var(--accent);
  border-radius:999px;padding:5px 11px;font-size:.78rem;font-weight:600;white-space:nowrap}
.dpill svg{width:13px;height:13px}
.sub{color:var(--muted);font-size:.72rem;font-weight:500;letter-spacing:.3px;margin-top:2px}
/* map */
.map{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden;margin-bottom:14px}
.map svg{display:block;width:100%;height:auto}
.maplabel{position:absolute;left:12px;top:12px;background:var(--surface);border:1px solid var(--line);
  border-radius:10px;padding:6px 10px;font-size:.74rem;color:var(--muted);font-weight:600;max-width:60%}
.maplabel b{color:var(--fg)}
.legend{position:absolute;right:12px;bottom:12px;display:flex;gap:9px;background:var(--surface);
  border:1px solid var(--line);border-radius:10px;padding:6px 9px;font-size:.68rem;color:var(--muted);font-weight:600}
.legend span{display:flex;align-items:center;gap:4px}
.legend i{width:9px;height:9px;border-radius:50%;display:inline-block}
/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:15px;margin-bottom:14px}
.card h2{font-size:1.12rem;margin-bottom:12px}
.card h2.row{display:flex;align-items:center;justify-content:space-between;gap:8px}
/* route planner */
.od{display:grid;grid-template-columns:1fr 34px;gap:9px;align-items:center}
.fields{display:flex;flex-direction:column;gap:9px;min-width:0}
.field{display:flex;align-items:center;gap:10px;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:3px 11px}
.field .dot{width:12px;height:12px;border-radius:50%;flex:none}
.field .dot.a{background:var(--accent)}
.field .dot.b{background:var(--rouge)}
.field label{font-size:.62rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:600;display:block}
.field select{width:100%;border:0;background:transparent;color:var(--fg);font-family:var(--body);font-size:.98rem;font-weight:600;padding:3px 0 5px;appearance:none;min-width:0}
.field select:focus{outline:none}
.swap{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--muted);display:flex;align-items:center;justify-content:center}
.swap svg{width:16px;height:16px}
.lbl{font-size:.64rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:600;margin:14px 0 7px}
.seg{display:flex;gap:7px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;
  padding:7px 13px;font-size:.84rem;font-weight:600;line-height:1}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip:focus-visible,.navbtn:focus-visible,select:focus-visible,.linkbtn:focus-visible,.join:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
/* route result */
.summary{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--accent-soft);
  border-radius:14px;padding:12px 14px;margin-bottom:4px}
.summary .big{font-family:var(--disp);font-weight:700;font-size:1.7rem;color:var(--accent);line-height:1;font-variant-numeric:tabular-nums}
.summary .meta{font-size:.82rem;color:var(--fg);font-weight:500}
.summary .meta b{font-family:var(--disp);font-size:1.02rem}
.alt{margin-left:auto;text-align:right;font-size:.78rem;color:var(--muted);font-weight:600;font-variant-numeric:tabular-nums}
.alt b{color:var(--fg);font-family:var(--disp);font-size:1rem}
.steps{list-style:none;margin:14px 0 0;padding:0;position:relative}
.steps::before{content:"";position:absolute;left:14px;top:12px;bottom:28px;width:2px;background:var(--line)}
.step{position:relative;display:flex;gap:13px;padding:7px 0;align-items:flex-start}
.step .mk{width:30px;height:30px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;
  background:var(--surface);border:2px solid var(--line);z-index:1;position:relative}
.step .mk .disc{width:15px;height:15px;border-radius:50%}
.step .mk svg{width:16px;height:16px;color:var(--muted)}
.step .mk.fin{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.step .bd{min-width:0;padding-top:3px}
.step .bd .act{font-weight:600}
.step .bd .act .nm{font-family:var(--disp);font-size:1.08rem;font-weight:700}
.step .bd .ln{display:flex;align-items:center;gap:7px;margin-top:3px;flex-wrap:wrap}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:.74rem;font-weight:600;color:var(--muted)}
.tag .disc{width:11px;height:11px;border-radius:50%}
.tag .sq{width:11px;height:11px;border-radius:3px}
.d-vert{background:var(--vert)}.d-bleu{background:var(--bleu)}.d-rouge{background:var(--rouge)}.d-noir{background:var(--noir)}
.time{font-size:.74rem;color:var(--muted);font-weight:600;font-variant-numeric:tabular-nums}
.alert{display:inline-flex;align-items:center;gap:6px;font-size:.76rem;font-weight:600;border-radius:8px;padding:4px 9px;line-height:1.25}
.alert svg{width:14px;height:14px;flex:none}
.alert.warn{color:var(--warn);background:var(--warn-bg)}
.alert.crit{color:var(--crit);background:var(--crit-bg)}
.alert.banner{display:flex;width:100%;margin-top:10px;padding:9px 12px;font-size:.84rem}
.alert.banner b{font-family:var(--disp);font-weight:700}
.nowline{font-size:.74rem;color:var(--muted);font-weight:600;margin-top:8px}
.homebar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:15px}
.homego{flex:1;min-width:0;display:flex;align-items:center;justify-content:center;gap:9px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);border-radius:12px;padding:11px 14px;font-weight:600;font-size:.95rem}
.homego svg{width:17px;height:17px;flex:none}
.linklike{border:0;background:transparent;color:var(--accent);font-weight:600;font-size:.86rem;display:inline-flex;align-items:center;gap:6px;padding:6px 2px}
.linklike svg{width:16px;height:16px}
.step .mk.warnmk{border-color:var(--warn)}
.step .mk.critmk{border-color:var(--crit)}
.empty{text-align:center;color:var(--muted);padding:22px 10px}
.empty b{color:var(--fg);font-family:var(--disp);font-size:1.1rem;display:block;margin-bottom:5px}
/* lists (friends / station / domains) */
.rowitem{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.rowitem:first-of-type{border-top:0}
.av{width:38px;height:38px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;
  font-family:var(--disp);font-weight:700;color:#fff;font-size:1rem}
.rowitem .info{min-width:0;flex:1}
.rowitem .info .nm{font-weight:600}
.rowitem .info .mt{font-size:.78rem;color:var(--muted)}
.join{border:1px solid var(--accent);background:transparent;color:var(--accent);border-radius:999px;padding:6px 13px;font-size:.8rem;font-weight:600;flex:none}
.state{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;font-weight:600}
.state i{width:9px;height:9px;border-radius:50%;flex:none}
.on i{background:var(--vert)}.on{color:var(--vert)}
.off i{background:var(--closed)}.off{color:var(--muted)}
.statline{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:4px}
.stat{flex:1;min-width:120px;background:var(--surface2);border-radius:13px;padding:11px 13px}
.stat .n{font-family:var(--disp);font-weight:700;font-size:1.5rem;line-height:1;font-variant-numeric:tabular-nums}
.stat .k{font-size:.74rem;color:var(--muted);font-weight:600;margin-top:3px}
.note{font-size:.76rem;color:var(--muted);background:var(--surface2);border-radius:11px;padding:9px 12px;margin-top:12px}
.note b{color:var(--fg)}
.toggle{display:flex;align-items:center;gap:10px;justify-content:space-between;background:var(--surface2);border-radius:13px;padding:11px 14px;margin-bottom:12px}
.sw{width:46px;height:27px;border-radius:999px;border:0;background:var(--closed);position:relative;flex:none;transition:background .15s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;background:#fff;transition:transform .15s}
.sw[aria-pressed="true"]{background:var(--accent)}
.sw[aria-pressed="true"]::after{transform:translateX(19px)}
.linkbtn{border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);border-radius:12px;padding:10px 15px;font-size:.9rem;font-weight:600;width:100%}
.linkbtn.done{background:transparent;color:var(--vert);border-color:var(--vert)}
.dl{border:1px solid var(--accent);background:transparent;color:var(--accent);border-radius:999px;padding:6px 13px;font-size:.8rem;font-weight:600;flex:none}
.dl.done{border-color:var(--line);color:var(--muted)}
.gps{display:flex;align-items:center;gap:12px;background:var(--accent-soft);border-radius:14px;padding:13px;margin-bottom:14px}
.gps svg{width:26px;height:26px;color:var(--accent);flex:none}
.gps .nm{font-family:var(--disp);font-weight:700;font-size:1.15rem}
.gps .mt{font-size:.78rem;color:var(--muted)}
/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px)}
.navin{max-width:500px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr);
  padding-left:max(4px,env(safe-area-inset-left,0px));padding-right:max(4px,env(safe-area-inset-right,0px))}
.navbtn{border:0;background:transparent;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 1px 8px;font-size:.62rem;font-weight:600}
.navbtn svg{width:21px;height:21px}
.search{display:flex;align-items:center;gap:9px;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:9px 12px;margin-bottom:13px}
.search svg{width:18px;height:18px;color:var(--muted);flex:none}
.search input{border:0;background:transparent;color:var(--fg);font-family:var(--body);font-size:.98rem;width:100%;min-width:0}
.search input:focus{outline:none}
.star{border:0;background:transparent;color:var(--closed);flex:none;padding:3px}
.star svg{width:23px;height:23px}
.star[aria-pressed="true"]{color:#e8a81f}
.price{font-variant-numeric:tabular-nums;color:var(--muted);font-weight:600}
.ygo{border:1px solid var(--line);background:var(--surface);color:var(--accent);border-radius:999px;padding:6px 12px;font-size:.8rem;font-weight:600;flex:none}
.rside{display:flex;flex-direction:column;align-items:flex-end;gap:8px;flex:none}
.navactions{display:flex;gap:9px;margin:2px 0 12px}
.startbtn{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--accent);color:#fff;border:0;border-radius:13px;padding:13px;font-family:var(--disp);font-weight:700;font-size:1rem;cursor:pointer}
.startbtn svg{width:18px;height:18px}
.simbtn{background:var(--surface2);color:var(--fg);border:1px solid var(--line);border-radius:13px;padding:13px 16px;font-weight:600;font-size:.92rem;cursor:pointer}
.navstop{background:var(--surface2);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:8px 14px;font-weight:600;font-size:.85rem;cursor:pointer}
.navstop.wide{width:100%;padding:13px;border-radius:13px}
.navcard{background:linear-gradient(135deg,#1f6feb,#3b82f6);color:#fff;border-radius:18px;padding:15px 16px;margin-bottom:12px;box-shadow:0 10px 24px rgba(31,111,235,.35)}
.navtop{display:flex;justify-content:space-between;align-items:center;font-size:.76rem;font-weight:600;opacity:.92;margin-bottom:9px}
.navbadge{background:rgba(255,255,255,.22);padding:3px 9px;border-radius:999px}
.navinstr{font-family:var(--disp);font-weight:800;font-size:1.3rem;line-height:1.2}
.navsub{font-size:.82rem;opacity:.92;margin-top:4px}
.navnext{font-size:.82rem;opacity:.85;margin-top:10px;padding-top:9px;border-top:1px solid rgba(255,255,255,.25)}
.navfoot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:12px}
.navdist{font-size:.85rem}.navdist b{font-family:var(--disp);font-size:1.02rem}
.navfoot .navstop{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.45);color:#fff}
.topright{display:flex;align-items:center;gap:8px}
.profbtn{position:relative;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--fg);display:inline-flex;align-items:center;justify-content:center;flex:none;cursor:pointer}
.profbtn svg{width:21px;height:21px}
.profbtn .dot{position:absolute;top:-1px;right:-1px;width:11px;height:11px;border-radius:50%;background:var(--rouge);border:2px solid var(--surface);display:none}
.profbtn.has-upd .dot{display:block}
.profhead{display:flex;align-items:center;gap:13px;margin-bottom:6px}
.profav{width:46px;height:46px;border-radius:50%;background:var(--surface2);display:inline-flex;align-items:center;justify-content:center;font-size:1.5rem;flex:none}
.toast{position:fixed;left:16px;right:16px;bottom:calc(86px + env(safe-area-inset-bottom));z-index:200;background:var(--fg);color:var(--surface);padding:12px 15px;border-radius:12px;font-size:.9rem;box-shadow:0 10px 26px rgba(0,0,0,.28);text-align:center;opacity:0;transform:translateY(10px);transition:opacity .2s,transform .2s;pointer-events:none}
.toast.show{opacity:1;transform:none}
.pfield{background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:8px 12px;margin-bottom:9px}
.pfield label{display:block;font-size:.68rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:2px}
.pfield input{border:0;background:transparent;color:var(--fg);font-family:var(--body);font-size:.98rem;width:100%;min-width:0}
.pfield input:focus{outline:none}
.about{font-size:.9rem;line-height:1.5;color:var(--fg);margin:2px 0 10px}
.guide{margin:0 0 12px;padding-left:18px}
.guide li{font-size:.88rem;line-height:1.45;margin:6px 0;color:var(--fg)}
.tip{display:flex;gap:11px;align-items:flex-start;background:var(--surface2);border:1px solid var(--line);border-radius:13px;padding:12px 13px}
.tip svg{width:23px;height:23px;color:var(--accent);flex:none;margin-top:1px}
.tip .nm{font-weight:700;margin-bottom:2px}
.tip .tipt{font-size:.86rem;line-height:1.45;color:var(--muted)}
.navbtn[aria-current="true"]{color:var(--accent)}
.hidden{display:none}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

  /* ---- navigation guidée pas-à-pas ---- */
  var nav=null, geoState={busy:false,near:null,me:null};
  var NAV_RADIUS=100; // m : seuil de déclenchement des notifications
  function turnAt(prevKey,curKey,nextKey){
    var P=N[prevKey],C=N[curKey],Q=N[nextKey];
    var inx=C.x-P.x,iny=C.y-P.y,outx=Q.x-C.x,outy=Q.y-C.y;
    var cross=inx*outy-iny*outx,dot=inx*outx+iny*outy;
    var ang=Math.atan2(cross,dot)*180/Math.PI; // y vers le bas : + = sens horaire = à droite
    if(Math.abs(ang)<22)return "straight";
    return ang>0?"right":"left";
  }
  function turnWord(t){return t==="right"?"à droite":t==="left"?"à gauche":"tout droit";}
  function stepInstruction(i){
    var e=nav.edges[i],w=nav.w;
    if(i===0){
      if(e.k==="piste")return {t:"Descends la "+e.n,s:DIFFLBL[e.d]+" · "+e.t+" min"};
      if(e.k==="bus")return {t:"Prends la "+e.n,s:e.sub};
      return {t:"Prends "+e.n,s:e.sub};
    }
    var prev=nav.edges[i-1],node=N[w[i]].name,turn=turnWord(turnAt(w[i-1],w[i],w[i+1]));
    if(e.k==="piste")return {t:"En bas de la "+prev.n+", "+turn+" — prends la "+e.n,s:DIFFLBL[e.d]+" · "+e.t+" min"};
    if(e.k==="bus")return {t:"À "+node+", prends la "+e.n,s:e.sub};
    return {t:"À "+node+", prends "+e.n,s:e.sub};
  }
  function navBuild(){
    var rt=route(state.from,state.to);if(!rt||!rt.length)return null;
    var w=[state.from];rt.forEach(function(e){w.push(e.b);});
    return {w:w,edges:rt,target:1,sim:false,watchId:null,simT:null,pos:{lat:N[state.from].lat,lon:N[state.from].lon},dist:null,lastInstr:null,nextPrev:null};
  }
  function navStart(sim){
    requestPerms();

    nav.sim=!!sim;

  function navStop(){

      if(nav.simT)clearInterval(nav.simT);

  function onPosition(lat,lon){
    if(!nav)return;nav.pos={lat:lat,lon:lon};
    var tn=N[nav.w[nav.target]];nav.dist=haversine(lat,lon,tn.lat,tn.lon);
    if(nav.dist<=NAV_RADIUS){
      if(nav.target>=nav.edges.length){notify("Skifaut — arrivée 🎿",N[state.to].name+" · tu es arrivé.");navStop();return;}
      var s=stepInstruction(nav.target);nav.lastInstr=s;notify("Skifaut",s.t);nav.target++;

    updateNavUI();
  }
  function navGpsStart(){
    var G=capPlugin("Geolocation");
    if(G&&G.watchPosition){try{G.watchPosition({enableHighAccuracy:true},function(p){if(p&&p.coords)onPosition(p.coords.latitude,p.coords.longitude);}).then(function(id){if(nav)nav.watchId=id;});}catch(e){}return;}
    if(navigator.geolocation){try{nav.watchId=navigator.geolocation.watchPosition(function(p){onPosition(p.coords.latitude,p.coords.longitude);},function(){},{enableHighAccuracy:true,maximumAge:1000});}catch(e){}}
  }
  function navSimStart(){
    nav.simT=setInterval(function(){
      if(!nav){return;}
      var tn=N[nav.w[Math.min(nav.target,nav.w.length-1)]],p=nav.pos,d=haversine(p.lat,p.lon,tn.lat,tn.lon),stepM=62;

    },520);
  }

  function filterHoraires(){
    var q=(state.hq||"").trim().toLowerCase(),vis=0;
    document.querySelectorAll("#hlist [data-hsearch]").forEach(function(el){
      var m=!q||el.getAttribute("data-hsearch").indexOf(q)>=0;el.hidden=!m;if(m)vis++;
    });
    var nr=document.getElementById("hnoresult");if(nr)nr.hidden=vis>0;
  }

  function parcours(){
    var day=DAYS.filter(function(d){return d.id===state.day;})[0];
    var h='<div class="card" style="padding-bottom:9px"><div class="seg" data-seg="day" style="margin-bottom:12px">'+DAYS.map(function(d){return '<button class="chip" aria-pressed="'+(state.day===d.id)+'" data-day="'+d.id+'">'+d.lbl+'</button>';}).join("")+'</div>';
    h+='<div style="font-family:var(--disp);font-weight:700;font-size:1.15rem;margin-bottom:11px">'+day.date+'</div>';
    h+=parcoursMap(day);
    if(state.ft){
      var sh=FRIENDS.filter(function(f){return f.shareTracks;});
      h+='<div class="seg" style="margin-top:4px;row-gap:6px"><span class="tag"><span class="disc" style="background:var(--accent)"></span>Moi</span>'+sh.map(function(f){return '<span class="tag"><span class="disc" style="background:'+f.c+'"></span>'+esc(f.name)+'</span>';}).join("")+'</div>';
    }
    h+='</div>';
    h+='<div class="card"><div class="toggle"><div><div style="font-weight:600">Voir les parcours des amis</div><div class="mt" style="font-size:.78rem;color:var(--muted)">En surimpression, s\'ils les partagent</div></div><button class="sw" id="ft" aria-pressed="'+state.ft+'" aria-label="Voir les parcours des amis"></button></div>';
    h+='<div class="statline"><div class="stat"><div class="n">'+day.km+'</div><div class="k">Distance</div></div><div class="stat"><div class="n">'+day.deniv+'</div><div class="k">Dénivelé négatif</div></div></div>';
    h+='<div class="statline"><div class="stat"><div class="n">'+day.pistes+'</div><div class="k">Pistes</div></div><div class="stat"><div class="n">'+day.lifts+'</div><div class="k">Remontées</div></div><div class="stat"><div class="n">'+day.temps+'</div><div class="k">Sur les skis</div></div></div>';
    h+='<div class="note">Tes journées sont enregistrées sur l\'appareil. Un ami n\'apparaît que s\'il accepte de partager son parcours — sinon il reste masqué.</div></div>';
    return h;
  }

  var pinIcon='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.3-7-11a7 7 0 0 1 14 0c0 4.7-7 11-7 11Z"/><circle cx="12" cy="10" r="2.5"/></svg>';
  function domaines(){
    var h='';
    // carte GPS
    if(geoState.me&&geoState.near){
      var nd=geoState.near;
      h+='<div class="gps">'+pinIcon+'<div style="flex:1;min-width:0"><div class="nm">'+esc(nd.d.name)+'</div><div class="mt">'+esc(nd.d.area)+' · '+esc(nd.d.massif)+' · à '+fmtKm(nd.km)+'</div></div><span class="state on"><i></i>Au plus près</span></div>';
      h+='<div class="card"><button class="linkbtn" data-dl="r'+esc(nd.d.name)+'">Télécharger '+esc(nd.d.name)+' · hors-ligne</button>'+
        '<div class="note">Position repérée par le GPS. Skifaut couvre tous les domaines français mais ne télécharge que celui où tu te trouves — ici le plus proche de ta position.</div></div>';
    }else{
      h+='<div class="gps">'+pinIcon+'<div style="flex:1;min-width:0"><div class="nm">Où es-tu ?</div><div class="mt">'+(geoState.err?"Position indisponible — autorise la localisation puis réessaie.":"Active le GPS pour détecter ton domaine.")+'</div></div></div>';
      h+='<div class="card"><button class="linkbtn'+(geoState.busy?" done":"")+'" data-locate '+(geoState.busy?"disabled":"")+'>'+(geoState.busy?"Localisation en cours…":"Me localiser")+'</button>'+
        '<div class="note">Skifaut utilise ta position pour trouver le domaine le plus proche et ne télécharger que celui-là.</div></div>';
    }
    // domaine de démonstration
    h+='<div class="card"><h2>Démonstration</h2><div class="rowitem"><div class="info"><div class="nm">Val Frisson'+(geoState.me?' · à '+fmtKm(haversine(geoState.me.lat,geoState.me.lon,N.village.lat,N.village.lon)/1000):'')+'</div><div class="mt">Domaine fictif · itinéraire &amp; navigation détaillés</div></div><button class="dl done" disabled>Prêt hors-ligne</button></div>'+
      '<div class="note">C\'est le domaine démo, avec le routage pas-à-pas complet. Les autres stations ci-dessous sont de vraies stations (identité &amp; position) ; leur plan détaillé sera produit par le collecteur.</div></div>';
    // stations réelles
    var list=REALDOMAINS.map(function(d){return d;});
    if(geoState.me)list.sort(function(a,b){return haversine(geoState.me.lat,geoState.me.lon,a.lat,a.lon)-haversine(geoState.me.lat,geoState.me.lon,b.lat,b.lon);});
    h+='<div class="card"><h2>Stations de ski françaises <span class="state"><i style="background:var(--muted)"></i>'+REALDOMAINS.length+'</span></h2>';
    list.forEach(function(d,i){
      var done=state.dl["r"+d.name],dist=geoState.me?' · à '+fmtKm(haversine(geoState.me.lat,geoState.me.lon,d.lat,d.lon)/1000):'';
      h+='<div class="rowitem"><div class="info"><div class="nm">'+esc(d.name)+'</div><div class="mt">'+esc(d.area)+' · '+esc(d.massif)+' · '+d.altMin+'–'+d.altMax+' m'+dist+'</div></div>'+
         '<button class="dl'+(done?" done":"")+'" data-dl="r'+esc(d.name)+'">'+(done?"Téléchargé":"Télécharger")+'</button></div>';
    });
    h+='</div>';
    h+='<div class="note" style="padding:0 2px"><b>Données.</b> Stations agrégées par le collecteur Skifaut depuis OpenStreetMap, Wikidata, Météo-France et SkiRadar. Ouvertures &amp; enneigement en temps réel via les flux des stations.</div>';
    return h;
  }

  function starSvg(f){return '<svg viewBox="0 0 24 24" fill="'+(f?"currentColor":"none")+'" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3l2.7 5.6 6.1.8-4.4 4.2 1.1 6-5.5-2.9L6.6 19.6l1.1-6L3.2 9.4l6.1-.8Z"/></svg>';}
  function manger(){
    var favs=RESTOS.filter(function(r){return state.fav[r.id];}),rest=RESTOS.filter(function(r){return !state.fav[r.id];});
    var list=favs.concat(rest);
    var h='<div class="card"><div class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg><input id="q" type="search" placeholder="Rechercher un lieu, un type…" value="'+esc(state.q||"")+'" autocomplete="off"></div>';
    h+='<div id="restos">';
    list.forEach(function(r){
      var isf=!!state.fav[r.id],ds=(r.name+" "+r.kind+" "+r.tag+" "+N[r.at].name+" "+r.price).toLowerCase();
      h+='<div class="rowitem" data-search="'+esc(ds)+'">'+
         '<button class="star" aria-pressed="'+isf+'" data-fav="'+r.id+'" aria-label="Mettre en favori">'+starSvg(isf)+'</button>'+
         '<div class="info"><div class="nm">'+esc(r.name)+'</div><div class="mt">'+esc(r.kind)+' · '+esc(N[r.at].name)+' · <span class="price">'+r.price+'</span></div>'+
         '<div class="mt" style="margin-top:2px">'+(r.open?'':'<span class="state off"><i></i>Fermé · </span>')+esc(r.tag)+'</div></div>'+
         '<button class="ygo" data-go="'+r.at+'">Y aller</button></div>';
    });
    h+='<div id="noresto" class="empty" hidden><b>Aucun résultat</b>Essaie un autre mot.</div>';
    h+='</div></div>';
    return h;
  }
  function filterRestos(){
    var q=(state.q||"").trim().toLowerCase(),vis=0;
    var rows=document.querySelectorAll("#restos [data-search]");
    rows.forEach(function(el){var m=!q||el.getAttribute("data-search").indexOf(q)>=0;el.hidden=!m;if(m)vis++;});
    var nr=document.getElementById("noresto");if(nr)nr.hidden=vis>0;
  }

  function profil(){
    var h='<div class="card"><div class="profhead"><div class="profav">⛷️</div><div style="min-width:0"><div class="nm" style="font-size:1.08rem">Mon profil</div><div class="mt">Skifaut · prototype</div></div></div>'+
      '<div class="toggle"><div><div style="font-weight:600">Partager ma position</div><div class="mt" style="font-size:.78rem;color:var(--muted)">Visible par tes amis du domaine</div></div><button class="sw" id="share" aria-pressed="'+state.share+'" aria-label="Partager ma position"></button></div></div>';
    // forfait
    var P=state.prof;
    h+='<div class="card"><h2>Mon forfait</h2>'+
      '<div class="pfield"><label>Nom du forfait</label><input id="pf-passname" type="text" value="'+esc(P.passName)+'" placeholder="Ex. 3 Vallées · 6 jours" autocomplete="off"></div>'+
      '<div class="pfield"><label>Référence / n° de carte</label><input id="pf-passref" type="text" value="'+esc(P.passRef)+'" placeholder="Ex. 01-2345-6789-0" autocomplete="off" inputmode="numeric"></div>'+
      '<div class="note">Garde ton numéro de carte sous la main (rechargement en ligne, SAV, perte). Enregistré uniquement sur cet appareil.</div></div>';
    // skis loués
    h+='<div class="card"><h2>Mes skis loués</h2>'+
      '<div class="pfield"><label>Magasin / modèle</label><input id="pf-skishop" type="text" value="'+esc(P.skiShop)+'" placeholder="Ex. Skiset · Rossignol Experience 80" autocomplete="off"></div>'+
      '<div class="pfield"><label>Référence location</label><input id="pf-skiref" type="text" value="'+esc(P.skiRef)+'" placeholder="Ex. bon n° 4821" autocomplete="off"></div>'+
      '<div class="note">Pratique en cas de casse, d\'échange de matériel ou de restitution.</div></div>';
    var v=devBuild()?"préversion (dev)":APP_VERSION;
    h+='<div class="card"><h2>Application</h2>'+
      '<div class="rowitem"><div class="info"><div class="nm">Version</div><div class="mt">'+esc(v)+(appUpd.avail?' · mise à jour disponible':(appUpd.checked&&!devBuild()?' · à jour':''))+'</div></div></div>'+
      '<div class="navactions" style="flex-wrap:wrap;margin-top:4px">'+
        '<button class="simbtn" data-checkupd'+(appUpd.checking?' disabled':'')+'>'+(appUpd.checking?"Recherche…":"Rechercher une mise à jour")+'</button>'+
        (appUpd.avail?'<button class="startbtn" data-getapk><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11m0 0 4.5-4.5M12 15l-4.5-4.5M5 20h14"/></svg>Télécharger la mise à jour</button>':'')+
      '</div>'+
      '<div class="note">'+(appUpd.avail?'Une fois téléchargé, ouvre le fichier <b>Skifaut.apk</b> pour l\'installer par-dessus : tes réglages sont conservés.':'L\'APK est hébergé sur GitHub. Le bouton vérifie s\'il existe une version plus récente, puis la télécharge.')+'</div></div>';
    // à propos
    h+='<div class="card"><h2>À propos</h2>'+
      '<p class="about">Skifaut t\'accompagne sur tout le domaine — <b>tout ce qu\'il faut quand il faut</b> : te repérer, trouver le meilleur itinéraire d\'un point à un autre, suivre tes journées et celles de tes amis, consulter les horaires et savoir où te restaurer.</p>'+
      '<ul class="guide">'+
        '<li><b>Carte</b> — ta position et l\'itinéraire optimal (quelle piste descendre, quelle remontée prendre), avec les alertes de fermeture.</li>'+
        '<li><b>Démarrer le parcours</b> — guidage pas-à-pas : une notification à chaque changement de piste ou de remontée.</li>'+
        '<li><b>Parcours &amp; Amis</b> — tes tracés du jour et ceux des amis qui acceptent de les partager.</li>'+
        '<li><b>Horaires, Manger, Domaines</b> — remontées, pistes, navettes, restos, activités, et le domaine repéré par GPS.</li>'+
      '</ul>'+
      '<div class="tip"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="6" width="12" height="12" rx="3"/><path d="M9 6 9.5 3h5l.5 3M9 18l.5 3h5l.5-3"/></svg>'+
        '<div><div class="nm">Avec une montre connectée</div><div class="tipt">Autorise les notifications de guidage : les instructions s\'affichent directement à ton poignet — plus besoin de sortir ton téléphone en skiant.</div></div></div>'+
      '</div>';
    return h;
  }
  var VIEWS={carte:carte,parcours:parcours,amis:amis,horaires:horaires,domaines:domaines,manger:manger,profil:profil};
  var NAVITEMS=[
    {k:"carte",l:"Carte",i:'<path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2Z"/><path d="M9 4v14M15 6v14"/>'},
    {k:"parcours",l:"Parcours",i:'<circle cx="6" cy="18" r="2"/><circle cx="18" cy="6" r="2"/><path d="M8 16.5 16 7.5" stroke-dasharray="2.5 3"/>'},
    {k:"amis",l:"Amis",i:'<circle cx="9" cy="8" r="3.2"/><path d="M3.5 20a5.5 5.5 0 0 1 11 0"/><circle cx="17" cy="9" r="2.6"/><path d="M15 15.6A4.6 4.6 0 0 1 21 20"/>'},
    {k:"horaires",l:"Horaires",i:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>'},
    {k:"domaines",l:"Domaines",i:'<path d="M12 21s-7-6.3-7-11a7 7 0 0 1 14 0c0 4.7-7 11-7 11Z"/><circle cx="12" cy="10" r="2.5"/>'},
    {k:"manger",l:"Manger",i:'<path d="M4 3v6a2 2 0 0 0 2 2 2 2 0 0 0 2-2V3M6 11v10"/><path d="M19 3a4 4 0 0 0-3 4v5h3Zm0 0v18"/>'}
  ];
  function renderNav(){
    document.getElementById("nav").innerHTML=NAVITEMS.map(function(it){
      return '<button class="navbtn" aria-current="'+(state.tab===it.k)+'" data-tab="'+it.k+'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+it.i+'</svg>'+it.l+'</button>';
    }).join("");
  }
  function render(){
    document.getElementById("view").innerHTML=VIEWS[state.tab]();
    renderNav();if(state.tab==="manger")filterRestos();if(state.tab==="horaires")filterHoraires();persist();
  }

  document.addEventListener("click",function(ev){
    var t=ev.target.closest("[data-tab],[data-crit],[data-level],[data-node],[data-join],[data-dl],[data-day],[data-hcat],[data-fav],[data-go],[data-nav],[data-nav-start],[data-nav-stop],[data-locate],[data-checkupd],[data-getapk],[data-home-go],[data-home-edit],#swap,#share,#ft");
    if(!t)return;var d=t.dataset;
    if(t.hasAttribute("data-nav-start")){navStart(t.getAttribute("data-nav-start")==="sim");return;}
    if(t.hasAttribute("data-nav-stop")){navStop();return;}
    if(t.hasAttribute("data-locate")){locate();return;}
    if(t.hasAttribute("data-checkupd")){checkUpdate(true);return;}
    if(t.hasAttribute("data-getapk")){getApk();return;}
    if(d.tab){state.tab=d.tab;render();window.scrollTo(0,0);return;}
    if(d.hcat){state.hcat=d.hcat;render();return;}
    if(d.crit){state.crit=d.crit;render();return;}
    if(d.level){state.level=d.level;render();return;}
    if(d.day){state.day=d.day;render();return;}
    if(t.id==="ft"){state.ft=!state.ft;render();return;}
    if(d.fav){state.fav[d.fav]=!state.fav[d.fav];render();return;}
    if(d.go){state.to=d.go;state.tab="carte";render();window.scrollTo(0,0);return;}
    if(d.nav!=null){state.navette=d.nav==="1";render();return;}
    if(t.hasAttribute("data-home-go")){if(state.home)state.to=state.home;state.homeEdit=false;render();return;}
    if(t.hasAttribute("data-home-edit")){state.homeEdit=!state.homeEdit;render();return;}
    if(d.node){if(d.node!==state.from){state.to=d.node;}render();return;}
    if(d.join){state.to=d.join;state.tab="carte";render();window.scrollTo(0,0);return;}
    if(d.dl!=null){state.dl[d.dl]=!state.dl[d.dl];render();return;}
    if(t.id==="swap"){var f=state.from;state.from=state.to;state.to=f;render();return;}
    if(t.id==="share"){state.share=!state.share;render();return;}
  });
  document.addEventListener("change",function(ev){
    if(ev.target.id==="from"){state.from=ev.target.value;render();}
    if(ev.target.id==="to"){state.to=ev.target.value;render();}
    if(ev.target.id==="homesel"){state.home=ev.target.value;state.homeEdit=false;render();}
  });
  document.addEventListener("input",function(ev){
    if(ev.target.id==="q"){state.q=ev.target.value;filterRestos();persist();return;}
    if(ev.target.id==="hq"){state.hq=ev.target.value;filterHoraires();persist();return;}
    var PF={"pf-passname":"passName","pf-passref":"passRef","pf-skishop":"skiShop","pf-skiref":"skiRef"};
    if(PF[ev.target.id]){state.prof[PF[ev.target.id]]=ev.target.value;persist();return;}
  });

  // Données stations produites par le collecteur (collector/) — on préfère
  // le fichier normalisé s'il est présent, sinon la liste embarquée.
  (function(){try{fetch("data/domains.json").then(function(r){return r.ok?r.json():null;}).then(function(j){if(j&&j.domains&&j.domains.length){REALDOMAINS=j.domains.map(function(d){return {name:d.name,massif:d.massif,area:d.area,lat:d.lat,lon:d.lon,altMin:d.altMin,altMax:d.altMax};});if(state.tab==="domaines")render();}}).catch(function(){});}catch(e){}})();

  render();
  if(NATIVE)setTimeout(function(){checkUpdate(false);},5000);
})();
</script>
