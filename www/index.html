  var state={tab:"carte",from:"lac",to:"sommet",crit:"rapide",level:"exp",share:true,dl:{},day:"auj",ft:true,q:"",fav:{r4:true},navette:true,home:"esserts",homeEdit:false,hcat:"remontees",hq:""};

  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
  function neighbours(){var m={};for(var k in N)m[k]=[];E.forEach(function(e){m[e.a].push(e);});return m;}
  function allowed(e){
    if(e.closed)return false;
    if(e.k==="bus"&&!state.navette)return false;
    if(e.k==="piste"&&RANK[e.d]>LEVELS[state.level].cap)return false;
    return true;
  }
  function cost(e){
    if(state.crit==="rapide")return e.t;
    if(state.crit==="remontees")return (e.k==="lift"?100:0)+e.t;
    return (e.k==="piste"?{vert:1,bleu:6,rouge:30,noir:150}[e.d]:3)+e.t*0.01;
  }
  function route(from,to){
    if(from===to)return [];
    var adj=neighbours(),dist={},prev={},seen={},keys=Object.keys(N);
    keys.forEach(function(k){dist[k]=Infinity;});dist[from]=0;
    for(var i=0;i<keys.length;i++){
      var u=null,best=Infinity;
      keys.forEach(function(k){if(!seen[k]&&dist[k]<best){best=dist[k];u=k;}});
      if(u===null)break;seen[u]=1;if(u===to)break;
      adj[u].forEach(function(e){if(!allowed(e))return;var nd=dist[u]+cost(e);if(nd<dist[e.b]){dist[e.b]=nd;prev[e.b]={e:e,from:u};}});
    }
    if(dist[to]===Infinity)return null;
    var path=[],c=to;while(c!==from){var p=prev[c];if(!p)return null;path.unshift(p.e);c=p.from;}
    return path;
  }

  function routeAlerts(rt){
    var acc=0,per={},worst=null;
    rt.forEach(function(e){
      if(e.k==="lift"){
        var close=closeMin(e.h),arr=NOW+acc,rem=close-arr,a=null;
        if(rem<=0)a={lvl:"crit",rem:rem,txt:"fermée à ton arrivée ("+fmt(close)+")"};
        else if(rem<=15)a={lvl:"crit",rem:rem,txt:"ferme à "+fmt(close)+" — dans "+rem+" min, dépêche-toi"};
        else if(rem<=60)a={lvl:"warn",rem:rem,txt:"ferme à "+fmt(close)+" — dans "+rem+" min à ton arrivée"};
        if(a){a.name=e.n;per[e.id]=a;if(!worst||(a.lvl==="crit"&&worst.lvl!=="crit")||(a.lvl===worst.lvl&&a.rem<worst.rem))worst=a;}

  function edgePath(e){var A=N[e.a],B=N[e.b];return "M"+A.x+" "+A.y+" L"+B.x+" "+B.y;}
  function renderMap(){
    var rt=route(state.from,state.to),onRoute={};

    // base edges

      var base=e.k==="lift"?"var(--closed)":e.k==="bus"?"var(--bus)":("var(--"+e.d+")");
      var cls=e.closed?"var(--closed)":base;
      var op=e.closed?.45:(e.k==="bus"&&!state.navette?.4:(onRoute[e.id]?.25:.9));
      var dash=e.k==="lift"?'stroke-dasharray="2 9" stroke-width="4"':e.k==="bus"?'stroke-dasharray="1.5 7" stroke-width="4"':'stroke-width="6"';

    // user position (départ)
    var u=N[state.from];
    svg+='<circle cx="'+u.x+'" cy="'+u.y+'" r="15" fill="var(--accent)" opacity=".28"><animate attributeName="r" values="12;21;12" dur="2.4s" repeatCount="indefinite"/></circle>';
    svg+='<circle cx="'+u.x+'" cy="'+u.y+'" r="8.5" fill="var(--accent)" stroke="var(--surface)" stroke-width="3"/>';
    // clickable hit areas -> set arrivée
    for(var k2 in N){var n2=N[k2];svg+='<circle cx="'+n2.x+'" cy="'+n2.y+'" r="26" fill="transparent" style="cursor:pointer" data-node="'+k2+'"></circle>';}

    var go=function(node){return '<button class="ygo" data-go="'+node+'">Y aller</button>';};
    var row=function(ds,inner,status,node){return '<div class="rowitem" data-hsearch="'+esc(ds.toLowerCase())+'"><div class="info">'+inner+'</div><div class="rside">'+status+go(node)+'</div></div>';};
    h+='<div class="card"><div class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg><input id="hq" type="search" placeholder="Rechercher dans les horaires…" value="'+esc(state.hq||"")+'" autocomplete="off"></div>';
    if(state.hcat==="pistes"){h+='<div class="note" style="margin:0 0 9px"><b>Dernière descente</b> conseillée à 16h45 · damage du domaine dès 17h30.</div>';}
    h+='<div id="hlist">';
    if(state.hcat==="remontees"){
      lifts.forEach(function(e){h+=row(e.n+" "+e.sub,'<div class="nm">'+esc(e.n)+'</div><div class="mt">'+esc(e.sub)+' · '+e.h+'</div>',e.closed?closeb("Fermée"):openb("Ouverte"),e.a);});
    }else if(state.hcat==="pistes"){
      pistes.forEach(function(e){h+=row(e.n+" "+DIFFLBL[e.d],'<div class="nm">'+esc(e.n)+'</div><div class="mt" style="margin-top:3px"><span class="tag"><span class="disc d-'+e.d+'"></span>'+DIFFLBL[e.d]+'</span></div>',e.closed?closeb("Fermée"):openb("Ouverte"),e.a);});
    }else if(state.hcat==="navettes"){
      NAVETTES.forEach(function(v){h+=row(v.n+" "+v.route,'<div class="nm">'+esc(v.n)+'</div><div class="mt">'+esc(v.route)+' · '+esc(v.freq)+'</div><div class="mt" style="margin-top:2px">'+v.h+'</div>',openb("En service"),v.node);});
    }else if(state.hcat==="restos"){
      RESTOS.forEach(function(r){h+=row(r.name+" "+r.kind+" "+N[r.at].name,'<div class="nm">'+esc(r.name)+'</div><div class="mt">'+esc(r.kind)+' · '+esc(N[r.at].name)+'</div><div class="mt" style="margin-top:2px">'+r.h+'</div>',r.open?openb("Ouvert"):closeb("Fermé"),r.at);});
    }else{
      ACTIVITES.forEach(function(a){h+=row(a.n+" "+a.loc,'<div class="nm">'+esc(a.n)+'</div><div class="mt">'+esc(a.loc)+'</div><div class="mt" style="margin-top:2px">'+esc(a.h)+'</div>',a.resa?closeb("Sur résa"):openb("Ouvert"),a.node);});
    }
    h+='<div id="hnoresult" class="empty" hidden><b>Aucun résultat</b>Essaie un autre mot ou une autre catégorie.</div>';
    h+='</div>';
    h+='<div class="note"><b>Collecteur Skifaut.</b> Chaque station publie son info à sa façon (page web, open-data, flux du domaine). Un collecteur type ETL récupère chaque source — pistes, remontées, navettes, restos, activités — et la ramène à un format commun. Mis à jour il y a 4 min.</div></div>';
    return h;
  }
  function filterHoraires(){
    var q=(state.hq||"").trim().toLowerCase(),vis=0;
    document.querySelectorAll("#hlist [data-hsearch]").forEach(function(el){
      var m=!q||el.getAttribute("data-hsearch").indexOf(q)>=0;el.hidden=!m;if(m)vis++;
    });
    var nr=document.getElementById("hnoresult");if(nr)nr.hidden=vis>0;
  }

  function parcours(){
    var day=DAYS.filter(function(d){return d.id===state.day;})[0];
    var h='<div class="card" style="padding-bottom:9px"><div class="seg" data-seg="day" style="margin-bottom:12px">'+DAYS.map(function(d){return '<button class="chip" aria-pressed="'+(state.day===d.id)+'" data-day="'+d.id+'">'+d.lbl+'</button>';}).join("")+'</div>';
    h+='<div style="font-family:var(--disp);font-weight:700;font-size:1.15rem;margin-bottom:11px">'+day.date+'</div>';
    h+=parcoursMap(day);
    if(state.ft){
      var sh=FRIENDS.filter(function(f){return f.shareTracks;});
      h+='<div class="seg" style="margin-top:4px;row-gap:6px"><span class="tag"><span class="disc" style="background:var(--accent)"></span>Moi</span>'+sh.map(function(f){return '<span class="tag"><span class="disc" style="background:'+f.c+'"></span>'+esc(f.name)+'</span>';}).join("")+'</div>';
    }
    h+='</div>';
    h+='<div class="card"><div class="toggle"><div><div style="font-weight:600">Voir les parcours des amis</div><div class="mt" style="font-size:.78rem;color:var(--muted)">En surimpression, s\'ils les partagent</div></div><button class="sw" id="ft" aria-pressed="'+state.ft+'" aria-label="Voir les parcours des amis"></button></div>';
    h+='<div class="statline"><div class="stat"><div class="n">'+day.km+'</div><div class="k">Distance</div></div><div class="stat"><div class="n">'+day.deniv+'</div><div class="k">Dénivelé négatif</div></div></div>';
    h+='<div class="statline"><div class="stat"><div class="n">'+day.pistes+'</div><div class="k">Pistes</div></div><div class="stat"><div class="n">'+day.lifts+'</div><div class="k">Remontées</div></div><div class="stat"><div class="n">'+day.temps+'</div><div class="k">Sur les skis</div></div></div>';
    h+='<div class="note">Tes journées sont enregistrées sur l\'appareil. Un ami n\'apparaît que s\'il accepte de partager son parcours — sinon il reste masqué.</div></div>';
    return h;
  }

  function domaines(){
    var h='<div class="gps"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.3-7-11a7 7 0 0 1 14 0c0 4.7-7 11-7 11Z"/><circle cx="12" cy="10" r="2.5"/></svg>'+
      '<div style="flex:1;min-width:0"><div class="nm">Val Frisson</div><div class="mt">Position GPS · Savoie · à 1,2 km</div></div><span class="state on"><i></i>Détecté</span></div>';
    h+='<div class="card"><button class="linkbtn done" disabled>Carte téléchargée · prête hors-ligne (14 Mo)</button>'+
      '<div class="note">Skifaut couvre tous les domaines français, mais ne télécharge que celui où tu te trouves, repéré par le GPS. Tu peux aussi en ajouter un à la main avant de partir.</div></div>';
    h+='<div class="card"><h2>Autres domaines</h2>';
    DOMAINS.forEach(function(dm,i){
      var done=state.dl["d"+i];
      h+='<div class="rowitem"><div class="info"><div class="nm">'+esc(dm.n)+'</div><div class="mt">'+esc(dm.d)+' · '+dm.s+'</div></div>'+
         '<button class="dl'+(done?" done":"")+'" data-dl="'+i+'">'+(done?"Téléchargé":"Télécharger")+'</button></div>';
    });
    h+='</div>';
    return h;
  }

  function starSvg(f){return '<svg viewBox="0 0 24 24" fill="'+(f?"currentColor":"none")+'" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3l2.7 5.6 6.1.8-4.4 4.2 1.1 6-5.5-2.9L6.6 19.6l1.1-6L3.2 9.4l6.1-.8Z"/></svg>';}
  function manger(){
    var favs=RESTOS.filter(function(r){return state.fav[r.id];}),rest=RESTOS.filter(function(r){return !state.fav[r.id];});
    var list=favs.concat(rest);
    var h='<div class="card"><div class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg><input id="q" type="search" placeholder="Rechercher un lieu, un type…" value="'+esc(state.q||"")+'" autocomplete="off"></div>';
    h+='<div id="restos">';
    list.forEach(function(r){
      var isf=!!state.fav[r.id],ds=(r.name+" "+r.kind+" "+r.tag+" "+N[r.at].name+" "+r.price).toLowerCase();
      h+='<div class="rowitem" data-search="'+esc(ds)+'">'+
         '<button class="star" aria-pressed="'+isf+'" data-fav="'+r.id+'" aria-label="Mettre en favori">'+starSvg(isf)+'</button>'+
         '<div class="info"><div class="nm">'+esc(r.name)+'</div><div class="mt">'+esc(r.kind)+' · '+esc(N[r.at].name)+' · <span class="price">'+r.price+'</span></div>'+
         '<div class="mt" style="margin-top:2px">'+(r.open?'':'<span class="state off"><i></i>Fermé · </span>')+esc(r.tag)+'</div></div>'+
         '<button class="ygo" data-go="'+r.at+'">Y aller</button></div>';
    });
    h+='<div id="noresto" class="empty" hidden><b>Aucun résultat</b>Essaie un autre mot.</div>';
    h+='</div></div>';
    return h;
  }
  function filterRestos(){
    var q=(state.q||"").trim().toLowerCase(),vis=0;
    var rows=document.querySelectorAll("#restos [data-search]");
    rows.forEach(function(el){var m=!q||el.getAttribute("data-search").indexOf(q)>=0;el.hidden=!m;if(m)vis++;});
    var nr=document.getElementById("noresto");if(nr)nr.hidden=vis>0;
  }

  var VIEWS={carte:carte,parcours:parcours,amis:amis,horaires:horaires,domaines:domaines,manger:manger};
  var NAVITEMS=[
    {k:"carte",l:"Carte",i:'<path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2Z"/><path d="M9 4v14M15 6v14"/>'},
    {k:"parcours",l:"Parcours",i:'<circle cx="6" cy="18" r="2"/><circle cx="18" cy="6" r="2"/><path d="M8 16.5 16 7.5" stroke-dasharray="2.5 3"/>'},
    {k:"amis",l:"Amis",i:'<circle cx="9" cy="8" r="3.2"/><path d="M3.5 20a5.5 5.5 0 0 1 11 0"/><circle cx="17" cy="9" r="2.6"/><path d="M15 15.6A4.6 4.6 0 0 1 21 20"/>'},
    {k:"horaires",l:"Horaires",i:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>'},
    {k:"domaines",l:"Domaines",i:'<path d="M12 21s-7-6.3-7-11a7 7 0 0 1 14 0c0 4.7-7 11-7 11Z"/><circle cx="12" cy="10" r="2.5"/>'},
    {k:"manger",l:"Manger",i:'<path d="M4 3v6a2 2 0 0 0 2 2 2 2 0 0 0 2-2V3M6 11v10"/><path d="M19 3a4 4 0 0 0-3 4v5h3Zm0 0v18"/>'}
  ];
  function renderNav(){
    document.getElementById("nav").innerHTML=NAVITEMS.map(function(it){
      return '<button class="navbtn" aria-current="'+(state.tab===it.k)+'" data-tab="'+it.k+'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+it.i+'</svg>'+it.l+'</button>';
    }).join("");
  }
  function render(){
    document.getElementById("view").innerHTML=VIEWS[state.tab]();
    renderNav();if(state.tab==="manger")filterRestos();if(state.tab==="horaires")filterHoraires();persist();
  }

  document.addEventListener("click",function(ev){
    var t=ev.target.closest("[data-tab],[data-crit],[data-level],[data-node],[data-join],[data-dl],[data-day],[data-hcat],[data-fav],[data-go],[data-nav],[data-home-go],[data-home-edit],#swap,#share,#ft");
    if(!t)return;var d=t.dataset;
    if(d.tab){state.tab=d.tab;render();window.scrollTo(0,0);return;}
    if(d.hcat){state.hcat=d.hcat;render();return;}
    if(d.crit){state.crit=d.crit;render();return;}
    if(d.level){state.level=d.level;render();return;}
    if(d.day){state.day=d.day;render();return;}
    if(t.id==="ft"){state.ft=!state.ft;render();return;}
    if(d.fav){state.fav[d.fav]=!state.fav[d.fav];render();return;}
    if(d.go){state.to=d.go;state.tab="carte";render();window.scrollTo(0,0);return;}
    if(d.nav!=null){state.navette=d.nav==="1";render();return;}
    if(t.hasAttribute("data-home-go")){if(state.home)state.to=state.home;state.homeEdit=false;render();return;}
    if(t.hasAttribute("data-home-edit")){state.homeEdit=!state.homeEdit;render();return;}
    if(d.node){if(d.node!==state.from){state.to=d.node;}render();return;}
    if(d.join){state.to=d.join;state.tab="carte";render();window.scrollTo(0,0);return;}
    if(d.dl!=null){state.dl["d"+d.dl]=!state.dl["d"+d.dl];render();return;}
    if(t.id==="swap"){var f=state.from;state.from=state.to;state.to=f;render();return;}
    if(t.id==="share"){state.share=!state.share;render();return;}
  });
  document.addEventListener("change",function(ev){
    if(ev.target.id==="from"){state.from=ev.target.value;render();}
    if(ev.target.id==="to"){state.to=ev.target.value;render();}
    if(ev.target.id==="homesel"){state.home=ev.target.value;state.homeEdit=false;render();}
  });
  document.addEventListener("input",function(ev){
    if(ev.target.id==="q"){state.q=ev.target.value;filterRestos();persist();return;}
    if(ev.target.id==="hq"){state.hq=ev.target.value;filterHoraires();persist();return;}
  });

  render();
})();
</script>
